backend:
  name: git-gateway
  branch: main

# Netlify Identity + Git Gateway must be enabled on the deployed Netlify site
# before this admin UI can log anyone in. See README.md → "Content-management
# UI (Decap CMS)" for the exact steps.

local_backend: false

# Points at the whole assets/ root (not a narrower "uploads" subfolder) so
# the media library's file browser can actually see every photo/video/logo
# that's really in this repo — they all live under assets/images/,
# assets/video/, and assets/brand/, none of them under assets/uploads/. A
# narrower media_folder here means existing photos just don't show up when
# staff try to browse/replace one. See reference/decisions-log.md.
media_folder: "assets"
public_folder: "/assets"

publish_mode: simple

collections:
  - name: "kiosk"
    label: "Kiosk Content"
    files:
      - file: "data/content.json"
        label: "Kiosk Content"
        name: "content"
        format: json
        fields:
          - label: "Logo"
            name: "logo"
            widget: "image"
            hint: "Header + splash-screen logo. Defaults to the official Auburn wordmark."

          - label: "Department"
            name: "department"
            widget: "object"
            fields:
              - { label: "Name (shown in header)", name: "name", widget: "string" }
              - { label: "Home screen headline", name: "heroTitle", widget: "string" }
              - { label: "Home screen subhead", name: "heroSub", widget: "string" }

          - label: "Apply Button / QR Link"
            name: "cta"
            widget: "object"
            fields:
              - { label: "URL (apply / request-info form)", name: "url", widget: "string" }
              - { label: "Button label", name: "label", widget: "string", default: "Apply now" }

          - label: "Return-to-home idle timeout (milliseconds)"
            name: "idleTimeoutMs"
            widget: "number"
            value_type: "int"
            min: 15000
            max: 600000
            hint: "How long with no touch before the kiosk returns to the splash screen. 90000 = 90 seconds."

          - label: "Splash slide duration (milliseconds)"
            name: "splashIntervalMs"
            widget: "number"
            value_type: "int"
            min: 3000
            max: 60000
            hint: "How long each splash-screen slide stays up. 7000 = 7 seconds."

          - label: "Gallery photo captions"
            name: "galleryCaptions"
            widget: "list"
            hint: "Cycled across each area's gallery photos, in order (e.g. photo 1 gets the first caption, photo 2 the second)."

          - label: "Splash Screen Slideshow"
            name: "splash"
            widget: "list"
            summary: "{{caption}}"
            fields:
              - { label: "Photo", name: "media", widget: "image", required: false, hint: "Leave blank to show a themed color slide instead." }
              - label: "Slide color"
                name: "theme"
                widget: "select"
                options: &auburn-colors
                  - { label: "Auburn Blue", value: "#0b2341" }
                  - { label: "Auburn Orange", value: "#e86100" }
                  - { label: "Bodda Getta Blue", value: "#0093d2" }
                  - { label: "Samford Brick Orange", value: "#cc4e0b" }
                  - { label: "Campus Green", value: "#4e8020" }
                  - { label: "Sunkissed Yellow", value: "#ffc044" }
                  - { label: "Never to Yield Teal", value: "#00a597" }
                  - { label: "Nova Brown", value: "#7a685b" }
              - { label: "Caption", name: "caption", widget: "string" }

          - label: "Areas (home screen tiles)"
            name: "areas"
            widget: "list"
            summary: "{{name}}"
            fields:
              - label: "ID"
                name: "id"
                widget: "string"
                pattern: ['^[a-z0-9-]+$', "Lowercase letters, numbers, and hyphens only — no spaces (e.g. brass, music-education)"]
                hint: "Used internally as a unique key. Don't change this for an existing area once it's live."
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Tagline", name: "tagline", widget: "string" }
              - label: "Home screen tile size"
                name: "size"
                widget: "select"
                options:
                  - { label: "Normal", value: "normal" }
                  - { label: "Large (flagship)", value: "large" }
                default: "normal"
                hint: "Large tiles take up 4x the space of a normal one on the home screen wall. Drag areas above to reorder them — the wall packs itself around whichever sizes you pick, in that order, so more than one large tile is fine too."
              - label: "Apply button override (optional)"
                name: "cta"
                widget: "object"
                required: false
                collapsed: true
                hint: "Leave both blank to use the site-wide Apply Button / QR Link above for this area. Fill in either one to send this area's full-screen preview and its page (including the QR code) somewhere else and/or show different button text. The home screen tile itself has no Apply button — tapping it always opens the preview."
                fields:
                  - { label: "URL", name: "url", widget: "string", required: false }
                  - { label: "Button label", name: "label", widget: "string", required: false }
              - label: "Icon"
                name: "icon"
                widget: "select"
                options:
                  - { label: "Brass", value: "brass" }
                  - { label: "Woodwind", value: "woodwind" }
                  - { label: "Voice", value: "voice" }
                  - { label: "Piano", value: "piano" }
                  - { label: "Commercial / speaker", value: "commercial" }
                  - { label: "Composition / notation", value: "composition" }
                  - { label: "Education / grad cap", value: "education" }
                  - { label: "Ensemble / people", value: "ensemble" }
              - label: "Tile & page color"
                name: "theme"
                widget: "select"
                options: *auburn-colors
                hint: "Pick one of Auburn's 8 official brand colors — don't introduce new ones."
              - { label: "Description", name: "description", widget: "text" }
              - label: "Quick facts"
                name: "facts"
                widget: "list"
                hint: "Short bullet points shown on the area page (e.g. degree name, ensembles)."
              - { label: "Hero photo (full-bleed, top of the area page)", name: "hero", widget: "image", required: false }
              - label: "Gallery photos"
                name: "photos"
                widget: "list"
                field: { label: "Photo", name: "photo", widget: "image" }
              - { label: "Gallery video clip", name: "video", widget: "file", required: false, hint: "Short MP4, ideally 10–30s, muted-friendly." }
              - { label: "Video cover frame", name: "poster", widget: "image", required: false }
              - label: "Full-screen preview playback"
                name: "previewPlayback"
                widget: "select"
                options:
                  - { label: "Photo (static, swipe to browse)", value: "photo" }
                  - { label: "Video (opens straight to the video, autoplaying)", value: "video" }
                  - { label: "Slideshow (auto-advances through photos/video)", value: "slideshow" }
                default: "photo"
                hint: "Controls what happens when a visitor taps this tile and it pops out full-screen. \"Video\" falls back to Photo if no video is set above."

          - label: "Lucky Man Studio"
            name: "luckyManStudio"
            widget: "object"
            hint: "A separate, one-off home screen tile. Unlike the areas above, tapping it opens straight to a full-screen picture of the studio with tappable hotspots (instead of a photo carousel and facts list). It uses the site-wide Apply button above."
            fields:
              - { label: "Tile name", name: "name", widget: "string", default: "Lucky Man Studio" }
              - { label: "Tile tagline", name: "tagline", widget: "string" }
              - label: "Home screen tile size"
                name: "size"
                widget: "select"
                options:
                  - { label: "Normal", value: "normal" }
                  - { label: "Large (flagship)", value: "large" }
                default: "normal"
              - label: "Tile color"
                name: "theme"
                widget: "select"
                options: *auburn-colors
                hint: "Pick one of Auburn's 8 official brand colors — don't introduce new ones. Also sets the default hotspot marker color below."
              - { label: "Studio photo (shown full-screen when the tile is tapped)", name: "image", widget: "image" }
              - label: "Hotspots"
                name: "hotspots"
                widget: "list"
                summary: "{{title}}"
                hint: "Tappable markers over the studio photo, one per piece of equipment or point of interest. Position is set as a percentage of the photo (0,0 = top-left corner, 100,100 = bottom-right) — open the photo, estimate where the spot is, and adjust the number until it lines up. The photo is shown full-screen and cropped to the display, so keep spots at least ~5% in from the edges."
                fields:
                  - { label: "Horizontal position % (0 = left edge, 100 = right edge)", name: "x", widget: "number", value_type: "float", min: 0, max: 100 }
                  - { label: "Vertical position % (0 = top edge, 100 = bottom edge)", name: "y", widget: "number", value_type: "float", min: 0, max: 100 }
                  - label: "Marker color"
                    name: "color"
                    widget: "select"
                    options: *auburn-colors
                    default: "#0b2341"
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Body", name: "body", widget: "markdown", hint: "Bold, italic, and links are supported." }
