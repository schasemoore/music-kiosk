<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Auburn University Department of Music</title>
  <meta name="description" content="Explore Auburn University's Department of Music — programs, ensembles, and how to apply.">
  <link rel="preconnect" href="https://use.typekit.net" crossorigin>
  <!-- Auburn's official Adobe Fonts (Typekit) kit: Sweet Sans Pro (body/UI) + Davis Sans (display) -->
  <link rel="stylesheet" href="https://use.typekit.net/wfy5sib.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app">

    <header class="site-header">
      <div class="brand" id="brand-home" role="button" aria-label="Go to home screen">
        <img class="brand-logo" src="assets/brand/auburn-logo.svg" alt="Auburn University">
        <div class="brand-text">
          <h1 id="dept-name">Department of Music</h1>
        </div>
      </div>
      <a class="btn btn-primary" href="#" data-cta-url data-cta-label target="_blank" rel="noopener"></a>
    </header>

    <!-- Hub / main menu -->
    <section class="view active" id="view-hub">
      <div class="eq-strip" id="eq-strip-hub"></div>
      <div class="hub-hero">
        <h2 id="hero-title"></h2>
        <p id="hero-sub"></p>
      </div>
      <div class="stage" id="program-list"></div>
    </section>

    <!-- Area detail -->
    <section class="view" id="view-area">
      <div id="area-content"></div>
    </section>

    <footer class="site-footer">
      <button class="btn btn-text" id="back-to-hub">Back to home</button>
      <span class="footer-note">Auburn University Department of Music</span>
    </footer>

    <!-- Idle attract screen: moving slideshow -->
    <div class="attract" id="attract">
      <div class="slideshow" id="splash-slideshow"></div>
      <div class="attract-overlay">
        <img class="brand-logo lg" src="assets/brand/auburn-logo.svg" alt="Auburn University">
        <h2 id="attract-caption">Department of Music</h2>
        <p>Touch anywhere to explore programs &amp; ensembles</p>
        <div class="eq-strip" id="eq-strip-attract"></div>
      </div>
    </div>

    <!-- Lightbox for photos / video -->
    <div class="lightbox" id="lightbox">
      <button class="lightbox-close" id="lightbox-close" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <div id="lightbox-body"></div>
    </div>

    <!-- Tap-a-tile preview: the tapped tile's photo pops out full-frame (see
         flipFly/openPreview in js/app.js) — no boxed panel, so this is just
         the close button + full-bleed media + a bottom info scrim. -->
    <div class="preview-modal" id="area-preview">
      <button class="preview-close" id="preview-close" aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <div class="preview-media" id="preview-media"></div>
      <div class="preview-info">
        <div class="preview-eyebrow" id="preview-eyebrow"></div>
        <h2 id="preview-name"></h2>
        <p class="tagline" id="preview-tagline"></p>
        <ul class="fact-list" id="preview-facts"></ul>
        <div class="preview-actions">
          <button class="btn btn-outline" id="preview-learn-more">More about this program</button>
          <a class="btn btn-primary" href="#" data-cta-url data-cta-label target="_blank" rel="noopener"></a>
        </div>
      </div>
    </div>

  </div>

  <script src="js/vendor/qrcode.js"></script>
  <script src="js/app.js"></script>

  <!--
    Netlify Identity invite/confirmation emails land here (the site root)
    with a token in the URL. This just forwards a logging-in staff member
    into the CMS at /admin — it has no effect on the kiosk itself.
  -->
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", (user) => {
        if (!user) {
          window.netlifyIdentity.on("login", () => {
            document.location.href = "/admin/";
          });
        }
      });
    }
  </script>
</body>
</html>
